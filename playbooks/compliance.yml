---
- name: Cisco IOS Compliance Validation
  hosts: "{{ target_host | default('sites_' + site, true) }}"
  gather_facts: false
  become: true
  become_method: ansible.netcommon.enable

  vars_files:
    - ../group_vars/standards.yml

  tasks:
    - name: Gather IOS facts
      cisco.ios.ios_facts:

    - name: Gather running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: running_config

    - name: Initialize compliance results
      set_fact:
        compliance_results: {}

    - name: Evaluate standards
      set_fact:
        compliance_results: >-
          {{
            compliance_results |
            combine({
              item.key:
              (
                'PASS'
                if (
                  (
                    (item.value.expected_state | default('present')) == 'present'
                    and
                    (
                      (
                        item.value.pattern is defined
                        and
                        item.value.pattern in running_config.stdout[0]
                      )
                      or
                      (
                        item.value.regex is defined
                        and
                        running_config.stdout[0]
                        is regex(item.value.regex, multiline=True)
                      )
                    )
                  )
                  or
                  (
                    (item.value.expected_state | default('present')) == 'absent'
                    and
                    not (
                      (
                        item.value.pattern is defined
                        and
                        item.value.pattern in running_config.stdout[0]
                      )
                      or
                      (
                        item.value.regex is defined
                        and
                        running_config.stdout[0]
                        is regex(item.value.regex, multiline=True)
                      )
                    )
                  )
                )
                else 'FAIL'
              )
            })
          }}
      loop: "{{ compliance_checks | dict2items }}"


    - name: Show compliance results
      debug:
        var: compliance_results

    - name: Count passed and total checks
      set_fact:
        passed_checks: "{{ compliance_results.values() | select('equalto', 'PASS') | list | length }}"
        total_checks: "{{ compliance_results | length }}"

    - name: Calculate compliance score
      set_fact:
        compliance_score: "{{ 0 if (total_checks | int) == 0 else (((passed_checks | int) * 100 / (total_checks | int)) | round(0)) }}"

    - name: Generate failed controls list
      set_fact:
        failed_controls: >-
          {{
            compliance_results
            | dict2items
            | selectattr('value', 'equalto', 'FAIL')
            | map(attribute='key')
            | list
          }}

    - name: Generate passed controls list
      set_fact:
        passed_controls: >-
          {{
            compliance_results
            | dict2items
            | selectattr('value', 'equalto', 'PASS')
            | map(attribute='key')
            | list
          }}

    - name: Determine compliance status
      set_fact:
        compliance_status: >-
          {% if compliance_score | int >= 90 %}
          COMPLIANT
          {% elif compliance_score | int >= 70 %}
          PARTIAL
          {% else %}
          NON_COMPLIANT
          {% endif %}

    - name: Build compliance report
      set_fact:
        compliance_report:
          hostname: "{{ ansible_net_hostname | default(inventory_hostname) }}"
          compliance_score: "{{ compliance_score | int }}"
          compliance_status: "{{ compliance_status | trim }}"
          timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"
          total_controls: "{{ total_checks | int }}"
          passed_controls: "{{ passed_controls }}"
          failed_controls: "{{ failed_controls }}"
          results: "{{ compliance_results }}"

    - name: Write compliance report to JSON
      delegate_to: localhost
      copy:
        content: "{{ compliance_report | to_nice_json }}"
        dest: "../reports/{{ ansible_net_hostname | default(inventory_hostname) }}_compliance.json"

    - name: Display Results
      debug:
        msg:
          hostname: "{{ ansible_net_hostname | default(inventory_hostname) }}"
          compliance_score: "{{ compliance_score }}"
          compliance_status: "{{ compliance_status | trim }}"
          passed_controls: "{{ passed_controls }}"
          failed_controls: "{{ failed_controls }}"
          results: "{{ compliance_results }}"

    # ------------------------------------------------------------------
    # Publish the result onto the device in NetBox, so an engineer sees a
    # coloured status against the switch instead of reading JSON reports.
    # Skipped when no NetBox credential is present, which is how the GitHub
    # workflows run this playbook.
    # ------------------------------------------------------------------
    - name: Publish compliance status to NetBox
      when: lookup('ansible.builtin.env', 'NETBOX_API') | length > 0
      delegate_to: localhost
      vars:
        netbox_api: "{{ lookup('ansible.builtin.env', 'NETBOX_API') | regex_replace('/$', '') }}"
        netbox_token: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
        # Explicit map rather than a lower/replace chain: an unexpected status
        # then fails loudly instead of writing a value the choice set rejects.
        netbox_status_map:
          COMPLIANT: compliant
          PARTIAL: partial
          NON_COMPLIANT: non-compliant
      module_defaults:
        ansible.builtin.uri:
          headers:
            Authorization: "Token {{ netbox_token }}"
            Content-Type: application/json
          validate_certs: false
      block:
        - name: Confirm the compliance status maps to a NetBox choice
          ansible.builtin.assert:
            that:
              - (compliance_status | trim) in netbox_status_map
            fail_msg: >-
              Compliance status '{{ compliance_status | trim }}' has no NetBox
              choice. Update netbox_status_map and the Compliance Status choice
              set together.

        - name: Find the device in NetBox
          ansible.builtin.uri:
            url: "{{ netbox_api }}/api/dcim/devices/?name={{ inventory_hostname | urlencode }}"
            method: GET
            status_code: [200]
          register: netbox_device
          no_log: true

        - name: Warn when the device is absent from NetBox
          ansible.builtin.debug:
            msg: >-
              '{{ inventory_hostname }}' was not found in NetBox; its compliance
              status was not published.
          when: netbox_device.json.count == 0

        - name: Write the compliance result onto the device
          ansible.builtin.uri:
            url: "{{ netbox_api }}/api/dcim/devices/{{ netbox_device.json.results[0].id }}/"
            method: PATCH
            body_format: json
            body: >-
              {{
                {
                  'custom_fields': {
                    'compliance_status': netbox_status_map[compliance_status | trim],
                    'compliance_score': compliance_score | int,
                    'compliance_checked': '%Y-%m-%d' | strftime,
                    'compliance_notes': (
                      'Failed controls: ' + (failed_controls | join(', '))
                      if failed_controls | length > 0
                      else 'All ' ~ (total_checks | int) ~ ' controls passing.'
                    ),
                  }
                }
              }}
            status_code: [200]
          when: netbox_device.json.count > 0
          changed_when: true
