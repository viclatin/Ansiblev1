---
- name: Remediate NTP Control
  hosts: "{{ target_host | default('sites_' + site, true) }}"
  tags:
    - ntp
  gather_facts: false

  vars:
    backups_dir: "{{ playbook_dir }}/../../backups"
    reports_dir: "{{ playbook_dir }}/../../reports"
    control_name: NTP
    control_id: NTP-001
    ntp_server: "8.8.8.8"
    control_description: Configure an NTP server for reliable time synchronization.
    compliance_criteria:
      pass: "ntp server {{ ntp_server }} present"
      fail: "ntp server {{ ntp_server }} missing"
    risk_of_non_compliance: Medium - inaccurate timestamps reduce audit and troubleshooting quality.
    remediation_commands:
      - "ntp server {{ ntp_server }}"
    validation_commands:
      - "show running-config | include ^ntp server {{ ntp_server }}"
    rollback_procedure: Restore the pre-remediation backup file saved in backups/.
    expected_outcome: NTP server entry is present in running configuration.
    report_suffix: ntp_remediation.json

  tasks:
    - name: Gather IOS facts
      cisco.ios.ios_facts:

    - name: Capture pre-remediation running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: pre_config

    - name: Build remediation timestamp
      set_fact:
        run_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Save pre-remediation backup
      delegate_to: localhost
      copy:
        content: "{{ pre_config.stdout[0] }}"
        dest: "{{ backups_dir }}/{{ ansible_net_hostname | default(inventory_hostname) }}_NTP_pre_{{ run_ts }}.cfg"

    - name: Apply NTP remediation
      cisco.ios.ios_config:
        lines: "{{ remediation_commands }}"

    - name: Validate NTP remediation
      cisco.ios.ios_command:
        commands: "{{ validation_commands }}"
      register: validation_output

    - name: Evaluate NTP compliance state
      set_fact:
        remediation_success: "{{ validation_output.stdout[0] is regex('^ntp server ' ~ ntp_server | regex_escape, multiline=True) }}"

    - name: Build NTP remediation report
      set_fact:
        remediation_report:
          control_name: "{{ control_name }}"
          control_id: "{{ control_id }}"
          hostname: "{{ ansible_net_hostname | default(inventory_hostname) }}"
          timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"
          control_description: "{{ control_description }}"
          compliance_criteria: "{{ compliance_criteria }}"
          risk_of_non_compliance: "{{ risk_of_non_compliance }}"
          remediation_commands: "{{ remediation_commands }}"
          validation_commands: "{{ validation_commands }}"
          validation_output: "{{ validation_output.stdout[0] | default('') }}"
          rollback_procedure: "{{ rollback_procedure }}"
          expected_outcome: "{{ expected_outcome }}"
          status: "{{ 'PASS' if remediation_success else 'FAIL' }}"

    - name: Write NTP remediation report
      delegate_to: localhost
      copy:
        content: "{{ remediation_report | to_nice_json }}"
        dest: "{{ reports_dir }}/{{ ansible_net_hostname | default(inventory_hostname) }}_{{ report_suffix }}"

    - name: Fail if NTP remediation did not pass validation
      fail:
        msg: "NTP remediation failed validation. Review remediation report and backup for rollback."
      when: not remediation_success
