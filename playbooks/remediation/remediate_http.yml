---
- name: Remediate HTTP Control
  hosts: "{{ target_host | default('sites_' + site, true) }}"
  tags:
    - http
  gather_facts: false
  become: true
  become_method: ansible.netcommon.enable

  vars:
    backups_dir: "{{ playbook_dir }}/../../backups"
    reports_dir: "{{ playbook_dir }}/../../reports"
    control_name: HTTP
    control_id: HTTP-001
    control_description: Disable plaintext HTTP management service.
    compliance_criteria:
      pass: "'no ip http server' not present"
      fail: "'ip http server' present"
    risk_of_non_compliance: High - cleartext management exposure.
    remediation_commands:
      - no ip http server
    validation_commands:
      - show running-config | include ^ip http server
    rollback_procedure: Restore the pre-remediation backup file saved in backups/.
    expected_outcome: ip http server line is absent from running configuration.
    report_suffix: http_remediation.json

  tasks:
    # An AWX survey can only set extra variables, never job_tags, so the
    # control is selectable by variable as well as by tag. When `control` is
    # undefined this does nothing and tag selection behaves exactly as before,
    # which is what the NetBox Remediate button relies on.
    - name: Skip unless HTTP was the selected control
      ansible.builtin.meta: end_play
      when:
        - control | default('') | length > 0
        - control | default('') | lower != 'http'

    - name: Ensure backup and report directories exist
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ backups_dir }}"
        - "{{ reports_dir }}"

    - name: Gather IOS facts
      cisco.ios.ios_facts:

    - name: Capture pre-remediation running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: pre_config

    - name: Build remediation timestamp
      set_fact:
        run_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Save pre-remediation backup
      delegate_to: localhost
      copy:
        content: "{{ pre_config.stdout[0] }}"
        dest: "{{ backups_dir }}/{{ ansible_net_hostname | default(inventory_hostname) }}_HTTP_pre_{{ run_ts }}.cfg"

    - name: Apply HTTP remediation
      cisco.ios.ios_config:
        save_when: modified
        lines: "{{ remediation_commands }}"

    - name: Validate HTTP remediation
      cisco.ios.ios_command:
        commands: "{{ validation_commands }}"
      register: validation_output

    - name: Evaluate HTTP compliance state
      set_fact:
        remediation_success: "{{ (validation_output.stdout[0] | trim) == '' }}"

    - name: Build HTTP remediation report
      set_fact:
        remediation_report:
          control_name: "{{ control_name }}"
          control_id: "{{ control_id }}"
          hostname: "{{ ansible_net_hostname | default(inventory_hostname) }}"
          timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"
          control_description: "{{ control_description }}"
          compliance_criteria: "{{ compliance_criteria }}"
          risk_of_non_compliance: "{{ risk_of_non_compliance }}"
          remediation_commands: "{{ remediation_commands }}"
          validation_commands: "{{ validation_commands }}"
          validation_output: "{{ validation_output.stdout[0] | default('') }}"
          rollback_procedure: "{{ rollback_procedure }}"
          expected_outcome: "{{ expected_outcome }}"
          status: "{{ 'PASS' if remediation_success else 'FAIL' }}"

    - name: Write HTTP remediation report
      delegate_to: localhost
      copy:
        content: "{{ remediation_report | to_nice_json }}"
        dest: "{{ reports_dir }}/{{ ansible_net_hostname | default(inventory_hostname) }}_{{ report_suffix }}"

    - name: Report that validation is not meaningful in check mode
      ansible.builtin.debug:
        msg: >-
          Check mode: the HTTP configuration was not applied, so the validation
          above reflects the device as it stands, not the outcome. Re-run with
          check mode off to apply and validate for real.
      when: ansible_check_mode

    - name: Fail if HTTP remediation did not pass validation
      fail:
        msg: "HTTP remediation failed validation. Review remediation report and backup for rollback."
      when:
        - not ansible_check_mode
        - not remediation_success
