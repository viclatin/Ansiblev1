---
- name: Apply approved Cisco IOS-XE syslog standard
  hosts: "{{ target_host | default('sites_' + site, true) }}"
  tags:
    - syslog
  gather_facts: false
  become: true
  become_method: ansible.netcommon.enable

  tasks:
    - name: Configure approved syslog destination
      cisco.ios.ios_config:
        lines:
          - no logging trap
          - logging trap warnings
          - logging host 2.2.2.2
        save_when: modified
