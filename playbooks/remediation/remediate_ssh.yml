---
- name: Remediate SSH Control
  hosts: cisco
  gather_facts: false

  vars:
    backups_dir: "{{ playbook_dir }}/../../backups"
    reports_dir: "{{ playbook_dir }}/../../reports"
    control_name: SSH
    control_id: SSH-001
    control_description: Restrict VTY access to SSH only.
    compliance_criteria:
      pass: line vty transport input ssh configured
      fail: telnet allowed or ssh not enforced on VTY lines
    risk_of_non_compliance: High - insecure remote management exposure.
    remediation_commands:
      - transport input ssh
    validation_commands:
      - show running-config | section ^line vty 0 4
    rollback_procedure: Restore the pre-remediation backup file saved in backups/.
    expected_outcome: line vty 0 4 contains transport input ssh.
    report_suffix: ssh_remediation.json

  tasks:
    - name: Gather IOS facts
      cisco.ios.ios_facts:

    - name: Capture pre-remediation running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: pre_config

    - name: Build remediation timestamp
      set_fact:
        run_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Save pre-remediation backup
      delegate_to: localhost
      copy:
        content: "{{ pre_config.stdout[0] }}"
        dest: "{{ backups_dir }}/{{ ansible_net_hostname | default(inventory_hostname) }}_SSH_pre_{{ run_ts }}.cfg"

    - name: Apply SSH remediation
      cisco.ios.ios_config:
        parents:
          - line vty 0 4
        lines: "{{ remediation_commands }}"

    - name: Validate SSH remediation
      cisco.ios.ios_command:
        commands: "{{ validation_commands }}"
      register: validation_output

    - name: Evaluate SSH compliance state
      set_fact:
        remediation_success: "{{ validation_output.stdout[0] is regex('^ transport input ssh$', multiline=True) }}"

    - name: Build SSH remediation report
      set_fact:
        remediation_report:
          control_name: "{{ control_name }}"
          control_id: "{{ control_id }}"
          hostname: "{{ ansible_net_hostname | default(inventory_hostname) }}"
          timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"
          control_description: "{{ control_description }}"
          compliance_criteria: "{{ compliance_criteria }}"
          risk_of_non_compliance: "{{ risk_of_non_compliance }}"
          remediation_commands: "{{ remediation_commands }}"
          validation_commands: "{{ validation_commands }}"
          validation_output: "{{ validation_output.stdout[0] | default('') }}"
          rollback_procedure: "{{ rollback_procedure }}"
          expected_outcome: "{{ expected_outcome }}"
          status: "{{ 'PASS' if remediation_success else 'FAIL' }}"

    - name: Write SSH remediation report
      delegate_to: localhost
      copy:
        content: "{{ remediation_report | to_nice_json }}"
        dest: "{{ reports_dir }}/{{ ansible_net_hostname | default(inventory_hostname) }}_{{ report_suffix }}"

    - name: Fail if SSH remediation did not pass validation
      fail:
        msg: "SSH remediation failed validation. Review remediation report and backup for rollback."
      when: not remediation_success
