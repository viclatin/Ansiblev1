---
- name: Validate Cisco IOS-XE syslog standard
  hosts: remediation_targets
  gather_facts: false
  become: true
  become_method: ansible.netcommon.enable

  tasks:
    - name: Collect configured syslog lines
      cisco.ios.ios_command:
        commands:
          - show running-config | include ^logging host 2.2.2.2
          - show running-config | include ^logging trap warnings
          - show running-config | include ^no logging trap
      register: syslog_validation

    - name: Combine syslog output for validation
      ansible.builtin.set_fact:
        syslog_validation_combined: "{{ syslog_validation.stdout | join('\n') }}"

    - name: Verify approved syslog configuration exists
      ansible.builtin.assert:
        that:
          - "'logging host 2.2.2.2' in syslog_validation_combined"
          - "'logging trap warnings' in syslog_validation_combined"
          - "'no logging trap' not in syslog_validation_combined"
        fail_msg: Syslog validation failed
        success_msg: Syslog validation passed
