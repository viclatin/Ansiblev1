---
# Survey-driven entry point for remediation, the counterpart to
# site-device-target.yml. Validation is identical: the site allowlist is derived
# from the live inventory, so a site added in NetBox is usable as soon as the
# AWX inventory source syncs.
#
# WHICH control runs is chosen with Ansible tags, not a variable, because each
# remediation play carries a play-level tag (aaa/http/ntp/snmp/ssh/syslog).
# Launch with job_tags set to the control. A templated
# `import_playbook: remediate_{{ control }}.yml` was rejected deliberately:
# imports resolve at parse time, before any assert can run, so an unvalidated
# value would be interpolated straight into a file path.
#
# Running with NO tags would apply every control. The AWX job template therefore
# sets job_tags on every launch, and the assert below refuses an untagged run.
- name: Resolve site/host target for remediation
  hosts: localhost
  gather_facts: false
  # Every task here must run whatever control tag was selected, otherwise the
  # tag filter would skip the validation entirely and remediation would proceed
  # against an unvalidated target.
  tags:
    - always
  vars:
    # Derived from the live inventory rather than hardcoded, so a site added in
    # NetBox is selectable as soon as the AWX inventory source syncs. The guard
    # rail is kept: an unknown site still fails loudly below.
    valid_sites: >-
      {{
        groups.keys()
        | select('match', '^sites_')
        | map('regex_replace', '^sites_', '')
        | sort
        | list
      }}
    valid_site_hosts: "{{ groups['sites_' + site] | default([]) | sort }}"

  tasks:
    - name: Validate the selected site
      ansible.builtin.assert:
        that:
          - site is defined
          - site | length > 0
          - site in valid_sites
        fail_msg: >-
          Invalid site '{{ site | default('') }}'.
          Sites currently in the inventory: {{ valid_sites | join(', ') }}.
          If the site exists in NetBox but is missing here, re-sync the AWX
          inventory source.

    - name: Validate the optional host against the chosen site
      ansible.builtin.assert:
        that:
          - target_host is not defined or target_host | length == 0 or target_host in valid_site_hosts
        fail_msg: >-
          Invalid host '{{ target_host | default('') }}' for site '{{ site }}'.
          Hosts at that site: {{ valid_site_hosts | join(', ') }}

    - name: Build the final target expression
      ansible.builtin.set_fact:
        selected_target: "{{ target_host if (target_host | default('')) | length > 0 else ('sites_' + site) }}"

    # A site can exist in NetBox before the switches that will live in it.
    # That is not an error, so finish quietly rather than failing. The site
    # allowlist assert above still catches a name that does not exist at all -
    # the difference that matters is "no such site" versus "no devices yet".
    - name: Report a site with no devices yet
      ansible.builtin.debug:
        msg: >-
          No devices at '{{ selected_target }}' yet. Nothing to do - add
          switches to this site in NetBox and they will be picked up on the
          next run.
      when: (groups[selected_target] | default([selected_target])) | length == 0

    - name: Finish early when there is nothing to target
      ansible.builtin.meta: end_play
      when: (groups[selected_target] | default([selected_target])) | length == 0

    # A device whose NetBox Platform is unset has no ansible_network_os, so
    # nothing knows how to talk to it. Report it and carry on: one incomplete
    # device should cost one unmonitored device, not the whole site. The
    # per-device skip happens in compliance.yml via meta: end_host.
    - name: Find devices with no Platform set in NetBox
      ansible.builtin.set_fact:
        unconfigured_hosts: >-
          {{
            (groups[selected_target] | default([selected_target]))
            | reject('in', hostvars | dict2items
                     | selectattr('value.ansible_network_os', 'defined')
                     | map(attribute='key') | list)
            | list
          }}

    - name: Report devices that will be skipped
      ansible.builtin.debug:
        msg: >-
          Skipping {{ unconfigured_hosts | join(', ') }} - no Platform set in
          NetBox, so there is no ansible_network_os and no way to connect. Every
          other device at this target is still assessed. Set the device's
          Platform in NetBox to include it.
      when: unconfigured_hosts | length > 0

    - name: Refuse an untagged run
      ansible.builtin.assert:
        that:
          - ansible_run_tags | difference(['all']) | length > 0
        fail_msg: >-
          No control selected. Launch with job_tags set to one of:
          aaa, http, ntp, snmp, ssh, syslog. Running untagged would apply
          every remediation to {{ selected_target }}.

    - name: Show the resolved target
      ansible.builtin.debug:
        msg: "Launching remediation against {{ selected_target }} (tags select the control)"

- name: Apply the selected remediation
  import_playbook: remediation/remediation_all.yml

# Re-score the device in the same job so the NetBox chip is correct the moment
# this finishes, rather than waiting for the hourly compliance schedule. In
# check mode the assessment still runs but publishes nothing.
- name: Re-assess compliance after the remediation
  import_playbook: compliance.yml
