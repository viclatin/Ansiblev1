---
- name: Roll back Cisco IOS-XE syslog change
  hosts: "{{ target_host | default('sites_' + site, true) }}"
  tags:
    - syslog
  gather_facts: false
  become: true
  become_method: ansible.netcommon.enable

  tasks:
    - name: Remove the approved syslog destination
      cisco.ios.ios_config:
        lines:
          - no logging host 2.2.2.2
          - no logging trap warnings
        save_when: modified
