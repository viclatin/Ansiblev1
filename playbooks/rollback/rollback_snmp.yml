---
# Reverses playbooks/remediation/remediate_snmp.yml by removing the community
# string it added. The device stops answering SNMP polls for that community,
# so monitoring will go blind for this host.
- name: Roll back Cisco IOS-XE SNMP change
  hosts: "{{ target_host | default('sites_' + site, true) }}"
  tags:
    - snmp
  gather_facts: false
  become: true
  become_method: ansible.netcommon.enable

  vars:
    snmp_community: "public"

  tasks:
    # An AWX survey can only set extra variables, never job_tags, so the
    # control is selectable by variable as well as by tag. Empty and undefined
    # both mean "not specified", so tag-driven runs are unaffected.
    - name: Skip unless SNMP was the selected control
      ansible.builtin.meta: end_play
      when:
        - control | default('') | length > 0
        - control | default('') | lower != 'snmp'

    - name: Remove the SNMP community added by remediation
      cisco.ios.ios_config:
        lines:
          - "no snmp-server community {{ snmp_community }}"
        save_when: modified
