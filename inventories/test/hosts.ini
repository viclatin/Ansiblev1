[remediation_targets]
Victors-Switch ansible_host=192.168.1.90

[production_canary_switches]
Victors-Switch ansible_host=192.168.1.90

[cisco:children]
remediation_targets
production_canary_switches

# Mirrors the group NetBox's nb_inventory plugin generates for site "toronto",
# so playbooks targeting sites_<site> resolve against this static inventory too.
[sites_toronto:children]
remediation_targets
production_canary_switches

# Mirrors the platforms_<slug> group NetBox generates. Connection settings come
# from group_vars/platforms_cisco_ios.yml, so they are not repeated here.
[platforms_cisco_ios:children]
remediation_targets
production_canary_switches
