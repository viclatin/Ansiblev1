---
name: Deploy Change to Test

run-name: Test ${{ inputs.change_id }} at ${{ inputs.commit_sha }}

# Applies the change: takes a fresh pre-change backup, then remediates,
# validates, and re-checks compliance on the test device. Run
# deploy-test-review.yml first and review its diff/job summary before
# running this workflow.

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: Change manifest identifier
        required: true
        type: string
      commit_sha:
        description: Merged commit SHA to deploy
        required: true
        type: string
      site:
        description: NetBox site whose group compliance.yml targets
        required: false
        default: toronto
        type: string

permissions:
  contents: read

concurrency:
  group: network-test
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on:
      - self-hosted
      - linux
      - network-test

    environment:
      name: network-test

    steps:
      - name: Check out exact merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Install Ansible dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Write device connection credentials
        env:
          ANSIBLE_NET_USERNAME: ${{ secrets.ANSIBLE_NET_USERNAME }}
          ANSIBLE_NET_PASSWORD: ${{ secrets.ANSIBLE_NET_PASSWORD }}
          ANSIBLE_NET_ENABLE_PASSWORD: ${{ secrets.ANSIBLE_NET_ENABLE_PASSWORD }}
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import os

          vars_path = os.path.join(os.environ["RUNNER_TEMP"], "test_device_vars.json")
          data = {
            "ansible_user": os.environ["ANSIBLE_NET_USERNAME"],
            "ansible_password": os.environ["ANSIBLE_NET_PASSWORD"],
            "ansible_become_password": os.environ.get("ANSIBLE_NET_ENABLE_PASSWORD", ""),
          }
          with open(vars_path, "w", encoding="utf-8") as f:
              json.dump(data, f)
          print(f"Wrote {vars_path}")
          PY

      - name: Validate change manifest policy
        run: |
          . .venv/bin/activate
          pytest -q tests/test_change_manifests.py

      - name: Back up test device
        id: backup
        run: |
          . .venv/bin/activate
          ansible-playbook \
            -i inventories/test/hosts.ini \
            --extra-vars "@${RUNNER_TEMP}/test_device_vars.json" \
            playbooks/backup.yml

      - name: Run test pre-check
        id: precheck
        run: |
          . .venv/bin/activate
          ansible-playbook \
            -i inventories/test/hosts.ini \
            --extra-vars "@${RUNNER_TEMP}/test_device_vars.json" \
            --extra-vars "site=${{ inputs.site }}" \
            playbooks/compliance.yml

      - name: Apply approved remediation in test
        id: remediate
        run: |
          . .venv/bin/activate
          ansible-playbook \
            -i inventories/test/hosts.ini \
            --extra-vars "@${RUNNER_TEMP}/test_device_vars.json" \
            --extra-vars "site=${{ inputs.site }}" \
            playbooks/remediation/remediate_syslog.yml

      - name: Validate test remediation
        id: validate
        run: |
          . .venv/bin/activate
          ansible-playbook \
            -i inventories/test/hosts.ini \
            --extra-vars "@${RUNNER_TEMP}/test_device_vars.json" \
            --extra-vars "site=${{ inputs.site }}" \
            playbooks/validation/validate_syslog.yml

      - name: Re-run test compliance
        id: postcheck
        run: |
          . .venv/bin/activate
          ansible-playbook \
            -i inventories/test/hosts.ini \
            --extra-vars "@${RUNNER_TEMP}/test_device_vars.json" \
            --extra-vars "site=${{ inputs.site }}" \
            playbooks/compliance.yml

      - name: Generate test result manifest
        if: always()
        env:
          CHANGE_ID: ${{ inputs.change_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          JOB_STATUS: ${{ job.status }}
          PRECHECK_STATUS: ${{ steps.precheck.outcome }}
          VALIDATE_STATUS: ${{ steps.validate.outcome }}
          POSTCHECK_STATUS: ${{ steps.postcheck.outcome }}
        run: |
          . .venv/bin/activate
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def as_compliance(step_outcome: str) -> str:
            return "PASS" if step_outcome == "success" else "FAIL"

          manifest = {
            "change_id": os.environ["CHANGE_ID"],
            "tested_commit_sha": os.environ["COMMIT_SHA"],
            "test_status": "PASSED" if os.environ["JOB_STATUS"] == "success" else "FAILED",
            "test_environment": "test",
            "compliance_before": as_compliance(os.environ.get("PRECHECK_STATUS", "failure")),
            "compliance_after": as_compliance(os.environ.get("POSTCHECK_STATUS", "failure")),
            "validation_status": "PASSED" if os.environ.get("VALIDATE_STATUS") == "success" else "FAILED",
            "rollback_tested": False,
          }

          output_path = Path("artifacts") / f"test-result-{manifest['change_id']}.json"
          output_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {output_path}")
          PY

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ inputs.change_id }}
          path: |
            reports/
            artifacts/test-result-${{ inputs.change_id }}.json
          retention-days: 30

      - name: Remove device connection credentials
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/test_device_vars.json"
