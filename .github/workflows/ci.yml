name: CI

on:
  push:
  pull_request:

jobs:
  ansible-quality:
    name: Ansible quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.18" "ansible-lint>=24.7.0" "yamllint>=1.35.1"

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Validate inventory files
        run: |
          ansible-inventory -i inventories/cisco.ini --list > /dev/null
          ansible-inventory -i inventories/network.ini --list > /dev/null

      - name: YAML lint (duplicate keys, invalid structure)
        run: yamllint -c .yamllint playbooks group_vars inventories

      - name: Ansible lint (undefined vars, play/task quality)
        run: ansible-lint --strict playbooks

      - name: Ansible syntax checks
        run: |
          while IFS= read -r playbook; do
            echo "Syntax checking ${playbook}"
            ansible-playbook -i inventories/cisco.ini --syntax-check "${playbook}"
          done < <(find playbooks -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)

  python-quality:
    name: Python quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install Python lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6.0"

      - name: Python syntax checks
        run: |
          while IFS= read -r py_file; do
            python -m py_compile "${py_file}"
          done < <(find agents api scripts -type f -name '*.py' ! -path 'scripts/venv/*' | sort)

      - name: Ruff lint
        run: ruff check agents api scripts --exclude scripts/venv
