name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  ansible-quality:
    name: Ansible quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      

      - name: Install Ansible tooling
        run: |
          python3 -m venv .venv-ci-ansible
          . .venv-ci-ansible/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.20,<2.22" "ansible-lint>=24.7.0" "yamllint>=1.35.1"

      - name: Install required collections
        run: |
          . .venv-ci-ansible/bin/activate
          ansible-galaxy collection install -r requirements.yml

      - name: Validate inventory files
        run: |
          . .venv-ci-ansible/bin/activate
          ansible-inventory -i inventories/test/hosts.ini --list > /dev/null
          ansible-inventory -i inventories/production/hosts.ini --list > /dev/null

      - name: YAML lint (duplicate keys, invalid structure)
        run: |
          . .venv-ci-ansible/bin/activate
          yamllint -c .yamllint playbooks group_vars inventories

      - name: Ansible lint (undefined vars, play/task quality)
        run: |
          . .venv-ci-ansible/bin/activate
          ansible-lint --strict playbooks

      - name: Ansible syntax checks
        shell: bash
        run: |
          . .venv-ci-ansible/bin/activate
          while IFS= read -r playbook; do
            echo "Syntax checking ${playbook}"
            # site is required by compliance.yml's templated hosts: expression,
            # which is evaluated during play parsing even under --syntax-check.
            ansible-playbook -i inventories/test/hosts.ini \
              --extra-vars "site=toronto" --syntax-check "${playbook}"
          done < <(find playbooks -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)

  python-quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          

      - name: Install Python lint tooling
        run: |
          python3 -m venv .venv-ci-python
          . .venv-ci-python/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6.0" "pytest>=8.0.0" "PyYAML>=6.0.0"

      - name: Python syntax checks
        shell: bash
        run: |
          . .venv-ci-python/bin/activate
          while IFS= read -r py_file; do
            python -m py_compile "${py_file}"
          done < <(find agents api scripts -type f -name '*.py' ! -path 'scripts/venv/*' | sort)

      - name: Ruff lint
        run: |
          . .venv-ci-python/bin/activate
          ruff check agents api scripts --exclude scripts/venv

      - name: Run policy and schema tests
        run: |
          . .venv-ci-python/bin/activate
          pytest -q tests/test_change_manifests.py