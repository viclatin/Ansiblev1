---
remediation_catalog:
  REM-SYSLOG-001:
    control: SYSLOG
    description: Configure approved centralized syslog destination
    severity: medium

    playbook: playbooks/remediation/remediate_syslog.yml
    validation_playbook: playbooks/validation/validate_syslog.yml
    rollback_playbook: playbooks/rollback/rollback_syslog.yml

    test_required: true
    production_approval_required: true

    supported_platforms:
      - cisco_ios_xe

    production_target_allowlist:
      - production_canary_switches

  REM-HTTP-001:
    control: HTTP
    description: Apply approved HTTP service state
    severity: medium

    playbook: playbooks/remediation/remediate_http.yml
    # No validation or rollback playbook exists for HTTP yet. SYSLOG is
    # currently the only control with a complete remediate/validate/rollback
    # set; the other five can be remediated but not automatically verified or
    # reverted. Add the files before relying on this control in production.

    test_required: true
    production_approval_required: true

    supported_platforms:
      - cisco_ios_xe

    production_target_allowlist:
      - production_canary_switches
